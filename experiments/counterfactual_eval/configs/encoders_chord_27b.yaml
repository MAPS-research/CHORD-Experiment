# CHORD's default encoder: frozen Qwen3.5-27B, PromptEOL `coherence` template,
# hidden layer -3 (block 62 of 64). Table 1 27B row.
#
#   python -m experiments.counterfactual_eval.featurize --config experiments/counterfactual_eval/configs/encoders_chord_27b.yaml --corpus-dir outputs/counterfactual/meta_eval
batch_size: 8

encoders:
  - name: qwen35-27b-prompteol-coherence-l62
    protocol:
      backend: huggingface
      model: Qwen/Qwen3.5-27B
      revision: fc05daec18b0a78c049392ed2e771dde82bdf654
      tokenizer_revision: fc05daec18b0a78c049392ed2e771dde82bdf654
      max_length: 512
      layer: -3
      pooling: prompteol
      prompteol_template: coherence
      normalization: none
      model_dtype: bfloat16
      cache_dtype: float32
