# Detection for the QA-faithfulness extension (encoders_qa_faithfulness.yaml).
# Same protocol as selectivity.yaml except the bandwidth dev split (150 texts,
# matching the smaller evaluation set).
#
#   python -m experiments.counterfactual_eval.selectivity --config experiments/counterfactual_eval/configs/selectivity_qa_faithfulness.yaml --corpus-dir outputs/casestudy/qa_faithfulness/evalset
draws: 200
n_eval: 1000
dev_size: 150
block_size: 1024
nominal_alpha: 0.05
# Order is the standing capacity wall; flag the top-dose order conditions.
wall_families: [sentence_permutation__r100, local_shuffle__r100]
# encoders: auto-detected from feats/ when omitted
