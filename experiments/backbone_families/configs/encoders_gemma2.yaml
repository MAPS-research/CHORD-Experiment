# CHORD with Gemma-2 backbones (Table 1 rows "Gemma-2-27B-it" and "Gemma-2-9B-it").
# Same protocol as the Qwen rows: PromptEOL `coherence` template, hidden layer -3
# (Gemma-2-9B: block 40 of 42; Gemma-2-27B: block 44 of 46), max_length 512, RBF-MMD.
# Nothing is re-tuned per family. Gemma-2 needs eager attention (its attention
# soft-capping is not supported by the fused kernels; with them the null
# calibration is wrong). The checkpoints are the ungated `unsloth` mirrors of
# google/gemma-2-{9b,27b}-it that produced the paper's numbers.
#
#   python -m experiments.counterfactual_eval.featurize --config experiments/backbone_families/configs/encoders_gemma2.yaml --corpus-dir outputs/counterfactual/meta_eval
#   python -m experiments.counterfactual_eval.selectivity --config experiments/counterfactual_eval/configs/selectivity.yaml --corpus-dir outputs/counterfactual/meta_eval \
#       --only-encoders gemma2-9b-prompteol-coherence-l40,gemma2-27b-prompteol-coherence-l44
batch_size: 8

encoders:
  - name: gemma2-9b-prompteol-coherence-l40
    protocol:
      backend: huggingface
      model: unsloth/gemma-2-9b-it
      revision: null
      tokenizer_revision: null
      max_length: 512
      layer: -3
      pooling: prompteol
      prompteol_template: coherence
      normalization: none
      model_dtype: bfloat16
      cache_dtype: float32
      attn_implementation: eager
  - name: gemma2-27b-prompteol-coherence-l44
    protocol:
      backend: huggingface
      model: unsloth/gemma-2-27b-it
      revision: null
      tokenizer_revision: null
      max_length: 512
      layer: -3
      pooling: prompteol
      prompteol_template: coherence
      normalization: none
      model_dtype: bfloat16
      cache_dtype: float32
      attn_implementation: eager
