# Qwen3-Embedding-8B as a feature space for CHORD's RBF-MMD endpoint (table tab:modern-baselines).
# Final-layer last-token embedding, L2-normalized, with the model's native
# instruction template: 'Instruct: {task}\nQuery:{text}' followed by the tokenizer's <|endoftext|>. Three input settings: no
# instruction, a similarity instruction and a coherence instruction.
# max_length 512 is the evaluation set's shared text budget; append_eos
# reserves the terminal token so truncation never removes it.
#   python -m experiments.counterfactual_eval.featurize \
#       --config experiments/embedding_evaluator_baselines/configs/encoders_qwen3_embedding_8b.yaml \
#       --corpus-dir outputs/counterfactual/meta_eval
#   for ENC in qwen3emb-8b-none qwen3emb-8b-sts qwen3emb-8b-coh; do
#     python -m experiments.counterfactual_eval.selectivity --config experiments/counterfactual_eval/configs/selectivity.yaml \
#         --corpus-dir outputs/counterfactual/meta_eval --only-encoders $ENC --out-suffix _modern_$ENC
#   done
batch_size: 16
encoders:
  - name: qwen3emb-8b-none
    protocol:
      backend: huggingface
      model: Qwen/Qwen3-Embedding-8B
      revision: 1d8ad4ca9b3dd8059ad90a75d4983776a23d44af
      tokenizer_revision: 1d8ad4ca9b3dd8059ad90a75d4983776a23d44af
      max_length: 512
      layer: last
      pooling: prompteol
      prompteol_template: "{text}"
      append_eos: "<|endoftext|>"
      normalization: l2
      model_dtype: bfloat16
      cache_dtype: float32
  - name: qwen3emb-8b-sts
    protocol:
      backend: huggingface
      model: Qwen/Qwen3-Embedding-8B
      revision: 1d8ad4ca9b3dd8059ad90a75d4983776a23d44af
      tokenizer_revision: 1d8ad4ca9b3dd8059ad90a75d4983776a23d44af
      max_length: 512
      layer: last
      pooling: prompteol
      prompteol_template: "Instruct: Retrieve semantically similar text.\nQuery:{text}"
      append_eos: "<|endoftext|>"
      normalization: l2
      model_dtype: bfloat16
      cache_dtype: float32
  - name: qwen3emb-8b-coh
    protocol:
      backend: huggingface
      model: Qwen/Qwen3-Embedding-8B
      revision: 1d8ad4ca9b3dd8059ad90a75d4983776a23d44af
      tokenizer_revision: 1d8ad4ca9b3dd8059ad90a75d4983776a23d44af
      max_length: 512
      layer: last
      pooling: prompteol
      prompteol_template: "Instruct: Represent the passage in terms of its logical coherence and the order of its ideas.\nQuery:{text}"
      append_eos: "<|endoftext|>"
      normalization: l2
      model_dtype: bfloat16
      cache_dtype: float32
