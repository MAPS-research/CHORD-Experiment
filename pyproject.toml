[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chord-experiments"
version = "0.1.0"
description = "Experiments of the CHORD paper (tables, figures and appendix studies)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "chord-metric[hf,distill]",
  # baseline metrics (official MAUVE, FBD) and correlation analyses
  "mauve-text>=0.4",
  "faiss-cpu>=1.12",
  "scikit-learn>=1.7",
  "scipy>=1.15",
  # UniEval sentence splitting, result tables
  "nltk>=3.9",
  "pandas>=2.1",
  "pyarrow>=15",
]

[project.optional-dependencies]
# Diffusion / flow generator sampling (SEDD, MDLM, LangFlow); see the library's
# environment-generators.yml.
generators = ["chord-metric[generators]"]

[tool.setuptools.packages.find]
include = ["experiments*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["outputs", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["chord", "experiments"]
